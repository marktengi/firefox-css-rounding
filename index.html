<html>
  <head>
    <style>
      .container {
        width: 100%;
        height: 120%;
        margin: 0 auto;
        background: gray;
      }
      .target {
        position: absolute;
        /* border: 1px solid #ccc; */
        height: 300px;
        width: 300px;
        left: 100px;
        top: 0.25px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        opacity: 0.75;
      }
      .hovered {
        outline: 4px solid green;
      }
      .correct {
        color: green;
      }
      .incorrect {
        color: red;
      }
      .translated {
        background-color: #f0f0f0;
        transform: translateY(100px);
      }
      .normal {
        background-color: #ffffff;
        margin-top: 100px;
        left: 200px;
        text-align: end;
      }
      #mouse-pos {
        position: fixed;
      }
    </style>
    <script>
      window.onload = () => {
        let timeout;
        const armReload = () =>
          // setTimeout(() => window.location.reload(), 5000);
          {};
        const container = document.getElementsByClassName("container")[0];
        const translated = document.getElementsByClassName("translated")[0];
        const normal = document.getElementsByClassName("normal")[0];
        const setText = () => {
          [translated, normal].forEach((el) => {
            const rect = el.getBoundingClientRect();
            const t = el.getElementsByClassName("top")[0];
            t.textContent = rect.top;
            const b = el.getElementsByClassName("bottom")[0];
            b.textContent = rect.bottom;
          });
        };
        setText();
        const setMousePos = (event) => {
          const mousePos = document.getElementById("mouse-pos");
          mousePos.textContent = `${event.clientX}, ${event.clientY}`;
        };

        const x = document.getElementById("x");
        window.onmousemove = (e) => {
          timeout && clearTimeout(timeout);
          timeout = armReload();

          setText();
          setMousePos(e);
          const hoveredElements = document.elementsFromPoint(
            e.clientX,
            e.clientY,
          );

          [translated, normal].forEach((el) => {
            if (hoveredElements.includes(el)) {
              el.classList.add("hovered");
            } else {
              el.classList.remove("hovered");
            }
            const box = el.getBoundingClientRect();
            if (
              box.top < e.clientY &&
              box.bottom > e.clientY &&
              box.left < e.clientX &&
              box.right > e.clientX
            ) {
              if (hoveredElements.includes(el)) {
                el.classList.add("correct");
                el.classList.remove("incorrect");
              } else {
                el.classList.remove("correct");
                el.classList.add("incorrect");
              }
            }
          });

          if (
            !hoveredElements.includes(translated) &&
            !hoveredElements.includes(normal)
          ) {
            translated.classList.remove("correct");
            translated.classList.remove("incorrect");
            normal.classList.remove("correct");
            normal.classList.remove("incorrect");
          }
        };
        window.onscroll = (e) => {
          setText();
        };
      };
    </script>
  </head>
  <body>
    <div class="container">
      In Firefox, scroll down a bit to where the fractional portion of the div
      offset is < 0.5. Then position your cursor where the two squares overlap
      and SLOWLY drag down over the bottom edge. There should be a time when the
      Normal div is hovered but the Translated one is not.
      <div id="mouse-pos"></div>
      <div class="target translated">
        <div class="text top"></div>
        <div class="text identifier">Translated</div>
        <div class="text bottom"></div>
      </div>
      <div class="target normal">
        <div class="text top"></div>
        <div class="text identifier">Normal</div>
        <div class="text bottom"></div>
      </div>
    </div>
    <div id="x"></div>
  </body>
</html>
